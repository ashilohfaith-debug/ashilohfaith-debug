<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 250" width="100%" height="100%">
  <defs>
    <!-- Gradients for Room -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f091a"/>
      <stop offset="100%" stop-color="#1e1332"/>
    </linearGradient>
    <linearGradient id="floorGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#110a1f"/>
      <stop offset="100%" stop-color="#06030b"/>
    </linearGradient>
    
    <!-- Window Clip -->
    <clipPath id="winClip">
      <rect x="850" y="40" width="280" height="130" rx="4"/>
    </clipPath>
  </defs>

  <style>
    /* Continuous Workflow Animations */
    
    /* Whiteboard Chart */
    .chart-draw {
      stroke-dasharray: 250;
      stroke-dashoffset: 250;
      animation: draw 6s ease-in-out infinite;
    }
    @keyframes draw {
      0%, 10% { stroke-dashoffset: 250; }
      50%, 90% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: 250; }
    }

    /* Server Lights */
    .blink-1 { animation: blink 1.2s infinite; }
    .blink-2 { animation: blink 0.8s infinite alternate; }
    .blink-3 { animation: blink 1.5s infinite steps(2); }
    @keyframes blink { 0% { opacity: 0.3; } 100% { opacity: 1; } }

    /* Wall Clock */
    .clock-min { animation: spin 4s linear infinite; transform-origin: 0 0; }
    .clock-hour { animation: spin 48s linear infinite; transform-origin: 0 0; }
    @keyframes spin { 100% { transform: rotate(360deg); } }

    /* Window Clouds */
    .cloud-move { animation: cloud 30s linear infinite; }
    @keyframes cloud { 
      0% { transform: translateX(50px); } 
      100% { transform: translateX(-350px); } 
    }

    /* Printer */
    .print-paper {
      stroke-dasharray: 20;
      stroke-dashoffset: 20;
      animation: printPaper 6s linear infinite;
    }
    @keyframes printPaper {
      0%, 20% { stroke-dashoffset: 20; opacity: 1; }
      40%, 80% { stroke-dashoffset: 0; opacity: 1; }
      85%, 100% { stroke-dashoffset: 0; opacity: 0; }
    }

    /* Staff Typing & Collaborating */
    .type-arm-right { transform-origin: -5px -55px; animation: typeRight 0.15s infinite alternate; }
    @keyframes typeRight { 0% { transform: rotate(0deg); } 100% { transform: rotate(5deg); } }
    
    .type-arm-left { transform-origin: 5px -55px; animation: typeLeft 0.18s infinite alternate; }
    @keyframes typeLeft { 0% { transform: rotate(0deg); } 100% { transform: rotate(-5deg); } }
    
    .point-arm { transform-origin: 5px -75px; animation: point 2s ease-in-out infinite alternate; }
    @keyframes point { 0% { transform: rotate(0deg); } 100% { transform: rotate(-8deg); } }

    /* Coffee Steam */
    .steam {
      stroke-dasharray: 10;
      stroke-dashoffset: 10;
      animation: steamRise 2s linear infinite;
      opacity: 0;
    }
    @keyframes steamRise {
      0% { stroke-dashoffset: 10; transform: translateY(0); opacity: 0; }
      50% { opacity: 0.6; }
      100% { stroke-dashoffset: -10; transform: translateY(-10px); opacity: 0; }
    }

    /* Walking Character */
    .walk-across { animation: walkAcross 16s linear infinite; }
    @keyframes walkAcross {
      0% { transform: translateX(-150px) translateY(210px); }
      100% { transform: translateX(1350px) translateY(210px); }
    }
    .walk-bob { animation: walkBob 0.4s ease-in-out infinite alternate; }
    @keyframes walkBob { 0% { transform: translateY(0); } 100% { transform: translateY(-4px); } }
    
    .leg-front { transform-origin: 0 -40px; animation: legSwing 0.4s ease-in-out infinite alternate; }
    .leg-back { transform-origin: 0 -40px; animation: legSwing 0.4s ease-in-out infinite alternate-reverse; }
    @keyframes legSwing { 0% { transform: rotate(-25deg); } 100% { transform: rotate(25deg); } }
  </style>

  <!-- Room Background -->
  <rect width="1200" height="200" fill="url(#bgGrad)"/>
  <rect y="200" width="1200" height="50" fill="url(#floorGrad)"/>
  <line x1="0" y1="200" x2="1200" y2="200" stroke="#271744" stroke-width="6"/>

  <!-- Server Rack (Left-Center Background) -->
  <g transform="translate(420, 70)">
    <rect width="80" height="130" fill="#271744" rx="4" stroke="#110a1f" stroke-width="4"/>
    <rect x="10" y="10" width="60" height="20" fill="#1e1332" rx="2"/>
    <circle cx="20" cy="20" r="3" fill="#00e5ff" class="blink-1"/>
    <circle cx="30" cy="20" r="3" fill="#ff007a" class="blink-2"/>
    
    <rect x="10" y="40" width="60" height="20" fill="#1e1332" rx="2"/>
    <circle cx="20" cy="50" r="3" fill="#00e5ff" class="blink-3"/>
    <circle cx="40" cy="50" r="3" fill="#ffb800" class="blink-1"/>
    
    <rect x="10" y="70" width="60" height="20" fill="#1e1332" rx="2"/>
    <circle cx="50" cy="80" r="3" fill="#ff007a" class="blink-2"/>
    
    <rect x="10" y="100" width="60" height="20" fill="#1e1332" rx="2"/>
    <circle cx="30" cy="110" r="3" fill="#00e5ff" class="blink-1"/>
  </g>

  <!-- Whiteboard (Left Background) -->
  <g transform="translate(80, 50)">
    <rect width="220" height="110" rx="8" fill="#e2e8f0"/>
    <rect x="5" y="5" width="210" height="100" rx="5" fill="#f8fafc"/>
    <!-- Faint grid -->
    <line x1="5" y1="30" x2="215" y2="30" stroke="#e2e8f0" stroke-width="1"/>
    <line x1="5" y1="55" x2="215" y2="55" stroke="#e2e8f0" stroke-width="1"/>
    <line x1="5" y1="80" x2="215" y2="80" stroke="#e2e8f0" stroke-width="1"/>
    <!-- Animated Chart -->
    <polyline points="20,90 60,60 100,75 160,20 200,35" fill="none" stroke="#ff007a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" class="chart-draw"/>
  </g>

  <!-- Wall Clock -->
  <g transform="translate(370, 70)">
    <circle cx="0" cy="0" r="25" fill="#1e1332" stroke="#271744" stroke-width="6"/>
    <line x1="0" y1="0" x2="0" y2="-12" stroke="#ffffff" stroke-width="3" stroke-linecap="round" class="clock-min"/>
    <line x1="0" y1="0" x2="10" y2="0" stroke="#00e5ff" stroke-width="3" stroke-linecap="round" class="clock-hour"/>
  </g>

  <!-- Window with Parallax City -->
  <g clip-path="url(#winClip)">
    <rect x="850" y="40" width="280" height="130" fill="#080411"/>
    <!-- Clouds -->
    <g class="cloud-move">
      <path d="M 880 70 Q 890 60 910 60 Q 930 60 940 70 Z" fill="#271744"/>
      <path d="M 1000 90 Q 1020 75 1040 90 Z" fill="#271744"/>
      <path d="M 1150 65 Q 1170 50 1190 65 Z" fill="#271744"/>
    </g>
    <!-- City Skyline -->
    <path d="M 850 170 L 850 120 L 870 120 L 870 80 L 910 80 L 910 130 L 940 130 L 940 60 L 990 60 L 990 110 L 1020 110 L 1020 50 L 1080 50 L 1080 140 L 1110 140 L 1110 90 L 1130 90 L 1130 170 Z" fill="#140d26"/>
    <!-- Glowing Windows -->
    <rect x="880" y="90" width="8" height="8" fill="#ffb800" opacity="0.6"/>
    <rect x="960" y="70" width="8" height="8" fill="#ffb800" opacity="0.6"/>
    <rect x="1040" y="60" width="8" height="8" fill="#00e5ff" opacity="0.6"/>
    <rect x="1090" y="110" width="8" height="8" fill="#ffb800" opacity="0.6"/>
    <!-- Glass Reflections -->
    <polygon points="860,170 940,40 980,40 900,170" fill="#ffffff" opacity="0.03" />
    <polygon points="1010,170 1060,40 1080,40 1030,170" fill="#ffffff" opacity="0.03" />
  </g>
  <!-- Window Frame -->
  <rect x="850" y="40" width="280" height="130" rx="4" fill="none" stroke="#271744" stroke-width="8"/>
  <line x1="990" y1="40" x2="990" y2="170" stroke="#271744" stroke-width="6"/>

  <!-- ================= MIDDLE GROUND (DESKS & STAFF) ================= -->

  <!-- Desk 1 (Left - Typing) -->
  <g transform="translate(180, 210)">
    <rect x="0" y="-45" width="90" height="6" fill="#3b2c58" rx="2"/>
    <line x1="10" y1="-40" x2="10" y2="0" stroke="#3b2c58" stroke-width="4"/>
    <line x1="80" y1="-40" x2="80" y2="0" stroke="#3b2c58" stroke-width="4"/>
    
    <!-- Character (Facing Left) -->
    <g transform="translate(80, 0)">
      <path d="M 15 -35 L 15 -25 L -5 -25" fill="none" stroke="#ff007a" stroke-width="6" stroke-linejoin="round"/>
      <line x1="5" y1="-25" x2="5" y2="0" stroke="#ff007a" stroke-width="4"/>
      <path d="M 15 -65 Q 5 -65 5 -25 L 25 -25 Z" fill="#ffb800"/>
      <circle cx="10" cy="-80" r="14" fill="#ffccbc"/>
      <!-- Typing Arm Left -->
      <g class="type-arm-left">
        <path d="M 5 -55 Q -10 -50 -25 -45" fill="none" stroke="#ffb800" stroke-width="6" stroke-linecap="round"/>
      </g>
    </g>

    <!-- Laptop -->
    <path d="M 30 -45 L 15 -45 L 25 -65 L 30 -65 Z" fill="#aab2cc"/>
    <path d="M 30 -45 L 5 -45 L 10 -40 L 40 -40 Z" fill="#707a94"/>
    <polygon points="25,-65 30,-65 20,-45 28,-45" fill="#00f0ff" opacity="0.5"/>
  </g>

  <!-- Desk 2 (Center - Collaboration) -->
  <g transform="translate(550, 210)">
    <rect x="0" y="-45" width="130" height="6" fill="#3b2c58" rx="2"/>
    <line x1="15" y1="-40" x2="15" y2="0" stroke="#3b2c58" stroke-width="4"/>
    <line x1="115" y1="-40" x2="115" y2="0" stroke="#3b2c58" stroke-width="4"/>
    
    <!-- Sitting Character (Facing Right) -->
    <g transform="translate(15, 0)">
      <path d="M -15 -35 L -15 -25 L 5 -25" fill="none" stroke="#ffb800" stroke-width="6" stroke-linejoin="round"/>
      <line x1="-5" y1="-25" x2="-5" y2="0" stroke="#ffb800" stroke-width="4"/>
      <path d="M -15 -65 Q -5 -65 -5 -25 L -25 -25 Z" fill="#00f0ff"/>
      <circle cx="-10" cy="-80" r="14" fill="#8d6e63"/>
      <!-- Typing Arm Right -->
      <g class="type-arm-right">
        <path d="M -5 -55 Q 10 -50 25 -45" fill="none" stroke="#00f0ff" stroke-width="6" stroke-linecap="round"/>
      </g>
    </g>

    <!-- Laptop -->
    <path d="M 45 -45 L 60 -45 L 50 -65 L 45 -65 Z" fill="#aab2cc"/>
    <path d="M 45 -45 L 70 -45 L 65 -40 L 35 -40 Z" fill="#707a94"/>
    <polygon points="50,-65 45,-65 55,-45 47,-45" fill="#ff007a" opacity="0.5"/>

    <!-- Coffee Mug -->
    <rect x="80" y="-55" width="10" height="10" rx="2" fill="#ff4081"/>
    <path d="M 90 -52 C 94 -52, 94 -48, 90 -48" fill="none" stroke="#ff4081" stroke-width="2"/>
    <path d="M 82 -60 Q 80 -65 85 -70 T 82 -80" fill="none" stroke="#ffffff" stroke-width="1.5" class="steam"/>
    <path d="M 88 -58 Q 90 -63 85 -68 T 88 -78" fill="none" stroke="#ffffff" stroke-width="1.5" class="steam" style="animation-delay: 0.5s;"/>

    <!-- Standing Character (Facing Left) -->
    <g transform="translate(100, 0)">
      <line x1="0" y1="-45" x2="-10" y2="0" stroke="#110a1f" stroke-width="8" stroke-linecap="round"/>
      <line x1="0" y1="-45" x2="5" y2="0" stroke="#3b2c58" stroke-width="8" stroke-linecap="round"/>
      <path d="M -5 -85 Q 15 -85 10 -45 L -10 -45 Z" fill="#7000ff"/>
      <circle cx="5" cy="-100" r="14" fill="#ffb74d"/>
      <!-- Pointing Arm -->
      <g class="point-arm">
        <path d="M 5 -75 Q -20 -70 -40 -60" fill="none" stroke="#7000ff" stroke-width="6" stroke-linecap="round"/>
      </g>
    </g>
  </g>

  <!-- Desk 3 (Right - Printer Station) -->
  <g transform="translate(920, 210)">
    <rect x="0" y="-45" width="90" height="6" fill="#3b2c58" rx="2"/>
    <line x1="10" y1="-40" x2="10" y2="0" stroke="#3b2c58" stroke-width="4"/>
    <line x1="80" y1="-40" x2="80" y2="0" stroke="#3b2c58" stroke-width="4"/>
    
    <!-- Printer -->
    <rect x="15" y="-80" width="60" height="35" rx="6" fill="#707a94"/>
    <rect x="10" y="-80" width="70" height="10" rx="3" fill="#aab2cc"/>
    <!-- Printer Status Light -->
    <circle cx="20" cy="-75" r="2" fill="#00e676" class="blink-1"/>
    <!-- Paper slit -->
    <line x1="20" y1="-55" x2="70" y2="-55" stroke="#140d26" stroke-width="2"/>
    <!-- Animated Printing Paper (Thick Line drawing down) -->
    <line x1="45" y1="-55" x2="45" y2="-35" stroke="#ffffff" stroke-width="25" class="print-paper"/>
  </g>

  <!-- ================= FOREGROUND (PARALLAX & MOVEMENT) ================= -->

  <!-- Walking Character (Crossing Screen) -->
  <g class="walk-across">
    <g class="walk-bob">
      <!-- Back Leg -->
      <line x1="0" y1="-40" x2="0" y2="0" stroke="#110a1f" stroke-width="8" stroke-linecap="round" class="leg-back"/>
      <!-- Front Leg -->
      <line x1="0" y1="-40" x2="0" y2="0" stroke="#271744" stroke-width="8" stroke-linecap="round" class="leg-front"/>
      <!-- Body -->
      <path d="M -10 -80 Q 10 -80 10 -40 L -10 -40 Z" fill="#ffea00"/>
      <circle cx="0" cy="-95" r="14" fill="#8d6e63"/>
      <!-- Tablet -->
      <rect x="5" y="-60" width="15" height="20" rx="2" fill="#00e5ff" transform="rotate(20 5 -60)"/>
      <path d="M 0 -70 Q 10 -60 15 -50" fill="none" stroke="#ffea00" stroke-width="6" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Office Plants (Foreground Depth) -->
  <g transform="translate(60, 220)" opacity="0.95">
    <path d="M 0 0 Q -20 -40 -40 -50" fill="none" stroke="#00bfa5" stroke-width="5" stroke-linecap="round"/>
    <path d="M 0 0 Q 10 -50 30 -70" fill="none" stroke="#00c853" stroke-width="6" stroke-linecap="round"/>
    <circle cx="-40" cy="-50" r="18" fill="#00bfa5"/>
    <circle cx="30" cy="-70" r="22" fill="#00c853"/>
    <circle cx="-10" cy="-80" r="15" fill="#1de9b6"/>
  </g>
  
  <g transform="translate(1120, 220)" opacity="0.95">
    <path d="M 0 0 Q -10 -60 -30 -80" fill="none" stroke="#00c853" stroke-width="7" stroke-linecap="round"/>
    <circle cx="-30" cy="-80" r="25" fill="#00c853"/>
    <circle cx="10" cy="-50" r="18" fill="#00bfa5"/>
  </g>

</svg>
