<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="120">
  <defs>
    <!-- Sky & Mist Gradients -->
    <linearGradient id="mistGrad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#9d6ec7" stop-opacity="0.5"/>
      <stop offset="30%" stop-color="#7b4fa6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#6b2d8b" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="mistGradBottom" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6b2d8b" stop-opacity="0"/>
      <stop offset="70%" stop-color="#7b4fa6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#9d6ec7" stop-opacity="0.5"/>
    </linearGradient>

    <!-- Wave Gradients based on exact palette: #7b4fa6, #c2185b, #6b2d8b, #9d6ec7, #8b3a6b -->
    <linearGradient id="wave1Grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c2185b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#8b3a6b" stop-opacity="1"/>
    </linearGradient>
    
    <linearGradient id="wave2Grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8b3a6b" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#6b2d8b" stop-opacity="1"/>
    </linearGradient>

    <linearGradient id="wave3Grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7b4fa6" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#6b2d8b" stop-opacity="1"/>
    </linearGradient>

    <!-- Ship Gradients -->
    <linearGradient id="sailGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#f5eef8" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#d1b3e0" stop-opacity="0.75"/>
    </linearGradient>

    <linearGradient id="hullGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a2a18"/>
      <stop offset="50%" stop-color="#2c1a10"/>
      <stop offset="100%" stop-color="#140b07"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="drop-shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <filter id="reflection-blur" x="-20%" y="-20%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="3" />
    </filter>

    <!-- Rough Wave Paths (High Amplitude, 2400px width for 1200px seamless loop) -->
    <!-- Wave 1: 400px period, high peaks -->
    <path id="wave1-path" d="
      M 0 220 
      C 100 120, 300 360, 400 220
      C 500 120, 700 360, 800 220
      C 900 120, 1100 360, 1200 220
      C 1300 120, 1500 360, 1600 220
      C 1700 120, 1900 360, 2000 220
      C 2100 120, 2300 360, 2400 220
      V 450 H 0 Z" />

    <!-- Wave 2: 600px period, deeper troughs -->
    <path id="wave2-path" d="
      M 0 250 
      C 150 110, 450 430, 600 250
      C 750 110, 1050 430, 1200 250
      C 1350 110, 1650 430, 1800 250
      C 1950 110, 2250 430, 2400 250
      V 450 H 0 Z" />

    <!-- Wave 3: 1200px period, massive sweeping wave -->
    <path id="wave3-path" d="
      M 0 300 
      C 300 100, 900 500, 1200 300
      C 1500 100, 2100 500, 2400 300
      V 450 H 0 Z" />
  </defs>

  <style>
    /* CSS Animations for Rough Sea */
    .wave-slow {
      animation: waveMove 10s linear infinite;
    }
    .wave-med {
      animation: waveMove 7s linear infinite;
    }
    .wave-fast {
      animation: waveMove 4.5s linear infinite;
    }
    @keyframes waveMove {
      0% { transform: translateX(0); }
      100% { transform: translateX(-1200px); }
    }

    .boat-sail {
      animation: sail 18s linear infinite;
    }
    .boat-bob {
      animation: bob 3s ease-in-out infinite;
      transform-origin: 0 0;
    }
    @keyframes sail {
      0% { transform: translateX(-200px) translateY(240px); }
      100% { transform: translateX(1400px) translateY(240px); }
    }
    /* Dramatic pitching for rough ocean */
    @keyframes bob {
      0%, 100% { transform: translateY(-10px) rotate(-10deg); }
      50% { transform: translateY(45px) rotate(12deg); }
    }

    .firefly {
      animation: glowFlicker 3s ease-in-out infinite alternate;
    }
    @keyframes glowFlicker {
      0% { opacity: 0.1; transform: translateY(0) scale(0.8) translateX(0); }
      100% { opacity: 0.9; transform: translateY(-15px) scale(1.2) translateX(-10px); }
    }

    .bird-fly {
      animation: birdFly linear infinite;
    }
    @keyframes birdFly {
      0% { transform: translate(1300px, 100px) scale(0.3); }
      100% { transform: translate(-100px, 20px) scale(0.3); }
    }

    .rain-drop {
      animation: rainDrop linear infinite;
    }
    @keyframes rainDrop {
      0% { transform: translate(0, -50px); opacity: 0.5; }
      100% { transform: translate(-150px, 450px); opacity: 0; }
    }
    
    .flag-flap {
      animation: flap 0.3s ease-in-out infinite alternate;
      transform-origin: left center;
    }
    @keyframes flap {
      0% { transform: scaleX(1) skewY(0deg); }
      100% { transform: scaleX(0.8) skewY(-10deg); }
    }
  </style>

  <!-- Background Mist / Sky gradient -->
  <rect width="1200" height="400" fill="url(#mistGrad)" style="pointer-events: none;" opacity="0.7"/>

  <!-- High-speed Storm Rain -->
  <g stroke="#ffffff" stroke-width="1" opacity="0.3">
    <line x1="200" y1="0" x2="100" y2="100" class="rain-drop" style="animation-duration: 0.6s; animation-delay: 0.1s;"/>
    <line x1="400" y1="0" x2="300" y2="100" class="rain-drop" style="animation-duration: 0.5s; animation-delay: 0.3s;"/>
    <line x1="600" y1="0" x2="500" y2="100" class="rain-drop" style="animation-duration: 0.7s; animation-delay: 0.2s;"/>
    <line x1="800" y1="0" x2="700" y2="100" class="rain-drop" style="animation-duration: 0.55s; animation-delay: 0.4s;"/>
    <line x1="1000" y1="0" x2="900" y2="100" class="rain-drop" style="animation-duration: 0.65s; animation-delay: 0.1s;"/>
    <line x1="1200" y1="0" x2="1100" y2="100" class="rain-drop" style="animation-duration: 0.6s; animation-delay: 0.5s;"/>
  </g>

  <!-- Particles / Storm Embers -->
  <g class="fireflies" filter="url(#glow)">
    <circle cx="300" cy="150" r="2" fill="#ffffff" class="firefly" style="animation-delay: 0s;"/>
    <circle cx="550" cy="100" r="1.5" fill="#ffffff" class="firefly" style="animation-delay: 1.2s;"/>
    <circle cx="800" cy="180" r="2.5" fill="#ffffff" class="firefly" style="animation-delay: 0.5s;"/>
    <circle cx="1050" cy="120" r="1" fill="#ffffff" class="firefly" style="animation-delay: 2s;"/>
  </g>

  <!-- Distant Birds fighting the wind -->
  <g class="birds" opacity="0.6">
    <g class="bird-fly" style="animation-duration: 18s; animation-delay: 0s;">
      <path d="M 0 0 Q 10 -15 20 0 Q 10 -6 0 0 M 20 0 Q 30 -15 40 0 Q 30 -6 20 0" fill="none" stroke="#7b4fa6" stroke-width="2"/>
    </g>
    <g class="bird-fly" style="animation-duration: 20s; animation-delay: 3s;">
      <path d="M 0 0 Q 8 -12 16 0 Q 8 -5 0 0 M 16 0 Q 24 -12 32 0 Q 24 -5 16 0" fill="none" stroke="#6b2d8b" stroke-width="1.5"/>
    </g>
  </g>

  <!-- Background Storm Rocks -->
  <g class="rocks" fill="#2d1738" filter="url(#drop-shadow)">
    <path d="M 150 260 Q 170 150 200 260 Q 230 200 250 260 Z"/>
    <path d="M 900 280 Q 930 160 950 280 Q 980 200 1000 280 Z"/>
  </g>

  <!-- Rough Wave 1 (Back Layer) -->
  <use href="#wave1-path" fill="url(#wave1Grad)" class="wave-slow"/>

  <!-- Large Ship (Galleon) -->
  <g class="boat-sail">
    <g class="boat-bob">
      <!-- Shadow/Reflection deep in rough water -->
      <path d="M -80 15 C -40 30, 40 40, 80 15 C 90 0, 85 -10, 70 -10 L -60 0 Z" fill="#4a1a3b" opacity="0.5" filter="url(#reflection-blur)"/>

      <!-- Main Hull -->
      <path d="M -85 -5 C -40 35, 45 45, 85 -5 C 95 -25, 90 -45, 75 -45 C 50 -30, -50 -30, -65 -30 Z" fill="url(#hullGrad)" filter="url(#drop-shadow)"/>
      
      <!-- Raised Stern (Back) -->
      <path d="M -85 -5 L -95 -55 L -55 -40 Z" fill="#382012"/>
      <path d="M -95 -55 L -65 -30 L -85 -5 Z" fill="#2c1a10"/>
      <!-- Stern Windows/Decor -->
      <rect x="-85" y="-45" width="5" height="10" fill="#e8c678" transform="rotate(-30 -85 -45)"/>
      <rect x="-75" y="-40" width="5" height="10" fill="#e8c678" transform="rotate(-30 -75 -40)"/>

      <!-- Bowsprit (Front Pole) -->
      <line x1="75" y1="-40" x2="130" y2="-65" stroke="#1c0f09" stroke-width="4.5"/>
      <!-- Bowsprit Rigging -->
      <line x1="75" y1="-20" x2="125" y2="-60" stroke="#1c1c1c" stroke-width="0.5" opacity="0.7"/>

      <!-- Foremast -->
      <line x1="45" y1="-30" x2="45" y2="-120" stroke="#1c0f09" stroke-width="4.5"/>
      <!-- Foremast Rigging -->
      <path d="M 45 -115 L 125 -60 M 45 -80 L 100 -50" stroke="#1c1c1c" stroke-width="0.5" opacity="0.7"/>
      <!-- Foremast Sails billowing heavily forward -->
      <path d="M 45 -110 Q 95 -90 65 -60 Q 45 -60 45 -110 Z" fill="url(#sailGrad)" filter="url(#drop-shadow)"/>
      <path d="M 45 -60 Q 105 -45 75 -15 Q 45 -15 45 -60 Z" fill="url(#sailGrad)" filter="url(#drop-shadow)"/>

      <!-- Mainmast -->
      <line x1="-5" y1="-35" x2="-5" y2="-160" stroke="#1c0f09" stroke-width="5.5"/>
      <!-- Mainmast Rigging -->
      <path d="M -5 -155 L 45 -115 M -5 -110 L 45 -80" stroke="#1c1c1c" stroke-width="0.5" opacity="0.7"/>
      <!-- Mainmast Sails -->
      <path d="M -5 -145 Q 55 -120 30 -85 Q -5 -85 -5 -145 Z" fill="url(#sailGrad)" filter="url(#drop-shadow)"/>
      <path d="M -5 -85 Q 65 -60 40 -25 Q -5 -25 -5 -85 Z" fill="url(#sailGrad)" filter="url(#drop-shadow)"/>
      <!-- Crow's Nest -->
      <rect x="-12" y="-135" width="14" height="6" fill="#1c0f09" rx="1"/>

      <!-- Mizzenmast (Back) -->
      <line x1="-50" y1="-45" x2="-50" y2="-110" stroke="#1c0f09" stroke-width="3.5"/>
      <!-- Mizzenmast Rigging -->
      <path d="M -50 -105 L -5 -155" stroke="#1c1c1c" stroke-width="0.5" opacity="0.7"/>
      <!-- Mizzenmast Sail -->
      <path d="M -50 -100 Q -10 -80 -25 -55 Q -50 -55 -50 -100 Z" fill="url(#sailGrad)" filter="url(#drop-shadow)"/>

      <!-- Whipping Flags -->
      <g fill="#c2185b">
        <path d="M 45 -120 Q 20 -125 10 -115 Q 35 -110 45 -120 Z" class="flag-flap"/>
        <path d="M -5 -160 Q -35 -165 -45 -155 Q -25 -150 -5 -160 Z" class="flag-flap"/>
        <path d="M -50 -110 Q -75 -115 -85 -105 Q -65 -100 -50 -110 Z" class="flag-flap"/>
      </g>

      <!-- Hull Shading & Planks -->
      <path d="M -75 -10 C -40 25, 45 35, 75 -10 C 65 5, -40 5, -75 -10 Z" fill="#140b07" opacity="0.7"/>
      <path d="M -80 -20 C -40 10, 45 20, 80 -20" stroke="#140b07" stroke-width="0.5" fill="none" opacity="0.8"/>
      <path d="M -75 -10 C -40 20, 45 30, 75 -10" stroke="#140b07" stroke-width="0.5" fill="none" opacity="0.8"/>
      <path d="M -70 0 C -40 25, 45 35, 70 0" stroke="#140b07" stroke-width="0.5" fill="none" opacity="0.8"/>
      
      <!-- Cannons / Portholes -->
      <circle cx="-40" cy="-5" r="2.5" fill="#000000" stroke="#3d2314" stroke-width="1"/>
      <circle cx="-15" cy="-2" r="2.5" fill="#000000" stroke="#3d2314" stroke-width="1"/>
      <circle cx="10" cy="0" r="2.5" fill="#000000" stroke="#3d2314" stroke-width="1"/>
      <circle cx="35" cy="-2" r="2.5" fill="#000000" stroke="#3d2314" stroke-width="1"/>
      <circle cx="60" cy="-6" r="2.5" fill="#000000" stroke="#3d2314" stroke-width="1"/>
    </g>
  </g>

  <!-- Rough Wave 2 (Middle Layer) -->
  <use href="#wave2-path" fill="url(#wave2Grad)" class="wave-med"/>

  <!-- Foreground Storm Rocks -->
  <g class="rocks-fg" fill="#180b21" filter="url(#drop-shadow)">
    <path d="M -50 350 Q 20 180 80 350 Q 120 280 150 400 L -50 400 Z"/>
    <path d="M 1050 400 Q 1100 200 1150 380 Q 1180 250 1250 400 L 1050 400 Z"/>
  </g>

  <!-- Rough Wave 3 (Front Layer) -->
  <use href="#wave3-path" fill="url(#wave3Grad)" class="wave-fast"/>

  <!-- Foreground Storm Haze -->
  <rect width="1200" height="400" fill="url(#mistGradBottom)" opacity="0.6"/>

</svg>
