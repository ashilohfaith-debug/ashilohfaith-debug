<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120" preserveAspectRatio="none" width="100%" height="120">
  <defs>
    <linearGradient id="wave1grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2563eb;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="wave2grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6d28d9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="wave3grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#5b21b6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e40af;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Wave layer 3 (back) -->
  <path fill="url(#wave3grad)" fill-opacity="0.4"
    d="M0,80 C150,40 300,100 450,70 C600,40 750,90 900,60 C1050,30 1150,75 1200,65 L1200,120 L0,120 Z">
    <animate attributeName="d" dur="7s" repeatCount="indefinite"
      values="
        M0,80 C150,40 300,100 450,70 C600,40 750,90 900,60 C1050,30 1150,75 1200,65 L1200,120 L0,120 Z;
        M0,65 C150,90 300,45 450,80 C600,110 750,50 900,85 C1050,110 1150,55 1200,75 L1200,120 L0,120 Z;
        M0,80 C150,40 300,100 450,70 C600,40 750,90 900,60 C1050,30 1150,75 1200,65 L1200,120 L0,120 Z
      " calcMode="spline" keySplines="0.4 0 0.6 1; 0.4 0 0.6 1" />
  </path>

  <!-- Wave layer 2 (mid) -->
  <path fill="url(#wave2grad)" fill-opacity="0.55"
    d="M0,90 C200,60 350,110 500,80 C650,50 800,100 950,70 C1100,45 1160,85 1200,75 L1200,120 L0,120 Z">
    <animate attributeName="d" dur="5.5s" repeatCount="indefinite"
      values="
        M0,90 C200,60 350,110 500,80 C650,50 800,100 950,70 C1100,45 1160,85 1200,75 L1200,120 L0,120 Z;
        M0,75 C200,105 350,55 500,90 C650,115 800,60 950,95 C1100,115 1160,65 1200,85 L1200,120 L0,120 Z;
        M0,90 C200,60 350,110 500,80 C650,50 800,100 950,70 C1100,45 1160,85 1200,75 L1200,120 L0,120 Z
      " calcMode="spline" keySplines="0.4 0 0.6 1; 0.4 0 0.6 1" />
  </path>

  <!-- Wave layer 1 (front) -->
  <path fill="url(#wave1grad)" fill-opacity="0.75"
    d="M0,95 C100,75 250,115 400,90 C550,65 700,105 850,80 C1000,55 1120,95 1200,85 L1200,120 L0,120 Z">
    <animate attributeName="d" dur="4s" repeatCount="indefinite"
      values="
        M0,95 C100,75 250,115 400,90 C550,65 700,105 850,80 C1000,55 1120,95 1200,85 L1200,120 L0,120 Z;
        M0,80 C100,100 250,65 400,100 C550,120 700,70 850,100 C1000,120 1120,75 1200,95 L1200,120 L0,120 Z;
        M0,95 C100,75 250,115 400,90 C550,65 700,105 850,80 C1000,55 1120,95 1200,85 L1200,120 L0,120 Z
      " calcMode="spline" keySplines="0.4 0 0.6 1; 0.4 0 0.6 1" />
  </path>
</svg>
