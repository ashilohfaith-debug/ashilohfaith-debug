name: Generate Snake Animation

on:
  schedule:
    # Run every 6 hours
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate Snake Animation
        uses: Platane/snk@v3
        with:
          github_user_name: ashilohfaith-debug
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Verify Generated Files
        run: |
          echo "✓ Verifying snake animation files..."
          ls -lah dist/
          test -f dist/github-contribution-grid-snake.svg && echo "✓ Light theme SVG generated" || exit 1
          test -f dist/github-contribution-grid-snake-dark.svg && echo "✓ Dark theme SVG generated" || exit 1

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Check for Changes
        id: verify-changed-files
        run: |
          git add dist/
          if git diff --cached --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and Push
        if: steps.verify-changed-files.outputs.changed == 'true'
        run: |
          git commit -m "chore: regenerate snake contribution animation [skip ci]"
          git push

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: snake-animation
          path: dist/
          retention-days: 30
