name: Generate Snake Animation

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate Snake — Light Theme
        uses: Platane/snk@v3
        with:
          github_user_name: ashilohfaith-debug
          outputs: >-
            dist/github-contribution-grid-snake.svg?color_snake=%23e8836a&color_dots=%23ede9f5,%23c4b5e8,%23a48cd6,%237c5cbf,%235b3fa8

      - name: Generate Snake — Dark Theme
        uses: Platane/snk@v3
        with:
          github_user_name: ashilohfaith-debug
          outputs: >-
            dist/github-contribution-grid-snake-dark.svg?color_snake=%23e8836a&color_dots=%231e1a2e,%233b2f6b,%235b3fa8,%237c5cbf,%23a48cd6

      - name: Verify Generated Files
        run: |
          echo "Verifying snake animation files..."
          ls -lah dist/
          test -f dist/github-contribution-grid-snake.svg      && echo "✓ Light SVG OK" || exit 1
          test -f dist/github-contribution-grid-snake-dark.svg && echo "✓ Dark SVG OK"  || exit 1

      - name: Configure Git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit & Push (if changed)
        run: |
          git add dist/
          if git diff --cached --quiet; then
            echo "No changes — skipping commit."
          else
            git commit -m "chore: regenerate snake contribution animation [skip ci]"
            git push
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: snake-animation
          path: dist/
          retention-days: 30