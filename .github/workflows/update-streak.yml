name: Update Streak Stats on Commit
on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Warm demolab cache
        run: |
          curl -s -H "Cache-Control: no-cache, no-store" \
               -H "Pragma: no-cache" \
               "https://streak-stats.demolab.com?user=ashilohfaith-debug&theme=dark&hide_border=true&background=120820&ring=7b4fa6&fire=c2185b&currStreakLabel=9d6ec7&sideLabels=9d6ec7&dates=ffffff&sideNums=c2185b&currStreakNum=7b4fa6" \
               -o /dev/null

      - name: Bust streak image cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          TIMESTAMP=$(date +'%Y-%m-%dT%H-%M-%S')
          # Fixed regex: matches cachebust= followed by any non-& and non-) characters
          sed -i "s/cachebust=[^&)]*/cachebust=$TIMESTAMP/" README.md
          git add README.md
          if git diff --cached --quiet; then
            echo "Nothing to commit, skipping push."
          else
            git commit -m "chore: refresh stats cache [$TIMESTAMP]"
            git push origin main
          fi
