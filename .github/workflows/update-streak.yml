name: Refresh README Stats

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Warm streak cache
        run: |
          curl -s "https://streak-stats.demolab.com?user=ashilohfaith-debug" -o /dev/null

      - name: Bust README cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          TIMESTAMP=$(date +'%Y-%m-%dT%H-%M-%S')

          if grep -q "<!-- stats-refresh:" README.md; then
            sed -i "s/<!-- stats-refresh:[^>]*-->/<!-- stats-refresh:$TIMESTAMP -->/" README.md
          else
            echo "<!-- stats-refresh:$TIMESTAMP -->" >> README.md
          fi

          git add README.md
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "chore: refresh stats [$TIMESTAMP]"
            git push
          fi
